name: Run Python Script and Push Output

# Controls when the action will run.
on:
  schedule:
    # Runs at the top of every hour (e.g., 1:00, 2:00, 3:00)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN permissions to write to the repository
    permissions:
      contents: write

    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the newest Python 3 version
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install the newest Git client
      - name: Install newest Git
        run: |
          sudo apt-get update
          sudo apt-get install git -y

      # 4. Clone the titledb repository
      # This will always clone the latest version of the 'master' branch
      # Uses whichever of blawar/titledb and borntohonk/titledb has the newer last commit
      - name: Clone TitleDB
        run: |
          # Clone only commit metadata first (no file contents), to compare dates cheaply
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/blawar/titledb.git titledb_blawar
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/borntohonk/titledb.git titledb_borntohonk

          blawar_ts=$(git -C titledb_blawar log -1 --format=%ct)
          borntohonk_ts=$(git -C titledb_borntohonk log -1 --format=%ct)
          echo "blawar/titledb:     $(git -C titledb_blawar log -1 --format='%ci  %h  %s')"
          echo "borntohonk/titledb: $(git -C titledb_borntohonk log -1 --format='%ci  %h  %s')"

          if [ "$borntohonk_ts" -gt "$blawar_ts" ]; then
            chosen=borntohonk
          else
            chosen=blawar
          fi
          echo "Using $chosen/titledb (newer)"
          echo "### TitleDB source: \`$chosen/titledb\`" >> $GITHUB_STEP_SUMMARY

          # Download file contents only for the chosen repo
          mv "titledb_$chosen" titledb
          git -C titledb checkout -q
          rm -rf titledb_blawar titledb_borntohonk

          git clone --depth 1 https://github.com/dev-chin/eshopScrapper.git

      # 5. Run your Python script
      - name: Run Python script
        run: |
          pip install requests
          python -u script.py

      # 6. Commit and push the files from the "output" folder
      - name: Push new files to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add --ignore-removal output/
          git add --ignore-removal output2/
          timestamp=$(date -u)
          git commit -m "Last update: $(timestamp)" || exit 0
          git push
